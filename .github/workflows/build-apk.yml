name: Build & Release APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*.*.*'          # Also triggers on version tags like v1.0.0
  workflow_dispatch:      # Allows manual trigger from GitHub Actions UI

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Java (required for Android build)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Setup Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      # 4. Create the .env file from GitHub Secrets
      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "APP_ENV=production" >> .env

      # 5. Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # 6. Run code generator (freezed, riverpod, json_serializable)
      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      # 7. Analyze code (lint check)
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      # 8. Run tests
      - name: Test
        run: flutter test

      # 9. Build release APK (unsigned — safe for testing/sharing)
      - name: Build APK (release)
        run: flutter build apk --release --split-per-abi

      # 10. Upload APK as artifact (available in Actions UI for 30 days)
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: eventhub-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      # 11. Create a GitHub Release with the APK (only on version tags)
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
